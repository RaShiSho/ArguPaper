[project]
name = "argupaper"
version = "0.1.0"
description = "Multi-Agent Research Cognition System"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "pydantic>=2.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
argupaper = "argupaper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
